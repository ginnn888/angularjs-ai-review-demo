name: Automated Quality Gate - AngularJS

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: aq-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # PR code runs on this read-only runner without AI secrets.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: install
        continue-on-error: true
        run: npm ci --ignore-scripts
      - name: Run tests using the original Automated Quality Gate
        if: always()
        uses: NonnaritRammaneekultawat-6609650459/test-github-marketplace@63362d19f946e75fdcd9d9754a5140d7dad05484
        with:
          project_type: angularjs
          phase: checks
          install_status: ${{ steps.install.outcome }}
      - name: Save Quality Gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-results
          path: .gate-state.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  report:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No checkout or execution of PR code in this privileged job.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: quality-gate-results
          path: .
      - name: Review and comment using the original Automated Quality Gate
        if: always()
        uses: NonnaritRammaneekultawat-6609650459/test-github-marketplace@63362d19f946e75fdcd9d9754a5140d7dad05484
        with:
          project_type: angularjs
          phase: report
          report_only: 'true'
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ github.token }}
          gemini_model: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          ai_timeout_seconds: '90'
